name: Android build (APK + AAB)

# Builds the Matix the Math Club app and uploads BOTH an APK and an AAB.
#
#  * Always builds debug + release APKs and debug + release AABs.
#  * If the repository has signing secrets (ANDROID_KEYSTORE_BASE64,
#    ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) the
#    release artifacts are signed with that upload key. Without them the
#    release build falls back to the debug keystore (see app/build.gradle.kts),
#    so the workflow never fails just because secrets are missing - forks and
#    pull requests still get installable artifacts.
#  * Runs on pushes to master, tags (v*), pull requests and manual dispatch.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to attach files to a GitHub Release on tags
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties (Android SDK path)
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "sdk.dir=${SDK_DIR}" > local.properties
          cat local.properties

      - name: Install Android SDK packages
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          else
            echo "sdkmanager not found - relying on the runner's preinstalled SDK / Gradle auto-download."
          fi

      - name: Decode release keystore (optional)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing: using the configured upload keystore."
          else
            echo "Release signing: no secrets found, release falls back to the debug keystore."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs and AABs (debug + release)
        run: >
          ./gradlew
          :app:assembleDebug :app:assembleRelease
          :app:bundleDebug :app:bundleRelease
          --stacktrace --no-daemon

      - name: List build outputs
        if: always()
        run: find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: matix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: matix-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: matix-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: matix-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
